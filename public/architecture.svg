<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative merchant-risk review architecture</title>
  <desc id="desc">Synthetic evidence flows through policy checks to analyst review and a decision receipt. All components are proposals, not measured production services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#e44e00"/>
      <stop offset="1" stop-color="#ff8a65"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a65"/>
    </marker>
  </defs>
  <rect width="1200" height="700" rx="32" fill="url(#bg)"/>
  <g opacity=".16" fill="#fff">
    <circle cx="70" cy="80" r="2"/><circle cx="180" cy="80" r="2"/><circle cx="290" cy="80" r="2"/><circle cx="400" cy="80" r="2"/><circle cx="510" cy="80" r="2"/><circle cx="620" cy="80" r="2"/><circle cx="730" cy="80" r="2"/><circle cx="840" cy="80" r="2"/><circle cx="950" cy="80" r="2"/><circle cx="1060" cy="80" r="2"/>
  </g>
  <text x="600" y="72" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="30" font-weight="800">Illustrative review flow</text>
  <text x="600" y="105" text-anchor="middle" fill="#a3a3a3" font-family="Inter, sans-serif" font-size="17">Provider-free concept · synthetic examples · no measured latency or throughput</text>

  <g filter="url(#shadow)" font-family="Inter, sans-serif">
    <g transform="translate(60 185)">
      <rect width="230" height="180" rx="20" fill="#242424" stroke="#525252" stroke-width="2"/>
      <rect width="230" height="8" rx="4" fill="url(#accent)"/>
      <text x="115" y="58" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">Evidence intake</text>
      <text x="30" y="96" fill="#d4d4d4" font-size="16">• Synthetic merchant pages</text>
      <text x="30" y="126" fill="#d4d4d4" font-size="16">• Example policy inputs</text>
      <text x="30" y="156" fill="#d4d4d4" font-size="16">• Source timestamps</text>
    </g>
    <g transform="translate(355 185)">
      <rect width="230" height="180" rx="20" fill="#242424" stroke="#525252" stroke-width="2"/>
      <rect width="230" height="8" rx="4" fill="url(#accent)"/>
      <text x="115" y="58" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">Policy checks</text>
      <text x="30" y="96" fill="#d4d4d4" font-size="16">• Deterministic rules</text>
      <text x="30" y="126" fill="#d4d4d4" font-size="16">• Evidence citations</text>
      <text x="30" y="156" fill="#d4d4d4" font-size="16">• Explicit abstention</text>
    </g>
    <g transform="translate(650 185)">
      <rect width="230" height="180" rx="20" fill="#242424" stroke="#525252" stroke-width="2"/>
      <rect width="230" height="8" rx="4" fill="url(#accent)"/>
      <text x="115" y="58" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">Analyst review</text>
      <text x="30" y="96" fill="#d4d4d4" font-size="16">• Accept or correct</text>
      <text x="30" y="126" fill="#d4d4d4" font-size="16">• Record rationale</text>
      <text x="30" y="156" fill="#d4d4d4" font-size="16">• Escalate uncertainty</text>
    </g>
    <g transform="translate(945 185)">
      <rect width="195" height="180" rx="20" fill="#242424" stroke="#525252" stroke-width="2"/>
      <rect width="195" height="8" rx="4" fill="url(#accent)"/>
      <text x="97.5" y="58" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">Receipt</text>
      <text x="24" y="96" fill="#d4d4d4" font-size="16">• Inputs</text>
      <text x="24" y="126" fill="#d4d4d4" font-size="16">• Decision</text>
      <text x="24" y="156" fill="#d4d4d4" font-size="16">• Review history</text>
    </g>
  </g>
  <g stroke="#ff8a65" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M 300 275 H 342"/><path d="M 595 275 H 637"/><path d="M 890 275 H 932"/>
  </g>
  <g transform="translate(230 455)">
    <rect width="740" height="150" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="370" y="44" text-anchor="middle" fill="#9a3412" font-family="Inter, sans-serif" font-size="22" font-weight="800">Pilot gate: verify before expanding</text>
    <text x="370" y="82" text-anchor="middle" fill="#7c2d12" font-family="Inter, sans-serif" font-size="17">Measure review quality, correction rate, latency, operating cost, and failure modes.</text>
    <text x="370" y="116" text-anchor="middle" fill="#7c2d12" font-family="Inter, sans-serif" font-size="17">The repository demonstrates this presentation only—not the proposed services above.</text>
  </g>
</svg>
